# Nginx — HTTPS (after certbot). Ensure /api/ goes to backend on port 443.

server {
    listen 443 ssl;
    server_name indiagovjob.online www.indiagovjob.online;

    # certbot manages these paths:
    # ssl_certificate /etc/letsencrypt/live/indiagovjob.online/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/indiagovjob.online/privkey.pem;

    client_max_body_size 20M;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name indiagovjob.online www.indiagovjob.online;
    return 301 https://$host$request_uri;
}
