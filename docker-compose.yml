services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - jobalert-data:/app/data
      - ./uploads:/app/uploads
    env_file:
      - ./backend/.env
    environment:
      # Avoid crash/OOM loop on small VPS while scrapers warm up; scheduled fetch still runs.
      - SKIP_INITIAL_FETCH=1
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api
        - API_URL=http://backend:8000
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: always

volumes:
  jobalert-data:
