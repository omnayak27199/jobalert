services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - jobalert-data:/app/data
      - ./uploads:/app/uploads
    env_file:
      - ./backend/.env.docker
      - path: ./backend/.env
        required: false
    environment:
      # Production defaults — override any typo in backend/.env
      - SKIP_INITIAL_FETCH=1
      - PUBLIC_SITE_URL=https://indiagovjob.online
      - CORS_ORIGINS=https://indiagovjob.online,https://www.indiagovjob.online,http://localhost:3000
      - ADMIN_EMAILS=omnayak27199@gmail.com
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api
        - API_URL=http://backend:8000
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - API_URL=http://backend:8000
      - NEXT_PUBLIC_SITE_URL=https://indiagovjob.online
    depends_on:
      backend:
        condition: service_healthy
    restart: always

volumes:
  jobalert-data:
