version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - jobalert-data:/app/data
      - ./uploads:/app/uploads
    env_file:
      - ./backend/.env
    environment:
      - CORS_ORIGINS=["http://localhost:3000","http://localhost","https://${DOMAIN:-localhost}"]
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: always

volumes:
  jobalert-data:
